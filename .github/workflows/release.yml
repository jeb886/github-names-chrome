name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check manifest version matches tag
        run: |
          version=$(jq -r .version manifest.json)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "manifest.json version $version != tag $GITHUB_REF_NAME"; exit 1; }
      - name: Package extension
        run: |
          mkdir -p dist/github-names-chrome
          cp -r manifest.json content.js background.js popup.html popup.js icons dist/github-names-chrome/
          cd dist && zip -r "github-names-chrome-$GITHUB_REF_NAME.zip" github-names-chrome
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/github-names-chrome-$GITHUB_REF_NAME.zip" --title "$GITHUB_REF_NAME" --generate-notes
